[package]
name = "nauti-fabric"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.58", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sysinfo = "0.37.2"
thiserror = "2.0.20"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
vm-memory = { version = "0.18.0", features = ["backend-mmap"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "signal"] }
iroh = "1.1.0"
anyhow = "1"
which = "5"
hwlocality = { version = "1.0.0-alpha.12", optional = true }
nvml-wrapper = { version = "0.13.0", optional = true }
vfio-ioctls = { version = "0.8", optional = true }
toml = "1.1.5"
# vhost-user device-backend family (M7). Kept optional so the default
# build stays dependency-light; versions are pinned to the pair that
# vhost-user-backend 0.23 itself uses (vm-memory 0.18 shared).
vhost = { version = "0.17", optional = true }
vhost-user-backend = { version = "0.23", optional = true }
virtio-bindings = { version = "0.2.7", optional = true }
virtio-queue = { version = "0.18", optional = true }
vmm-sys-util = { version = "0.15", optional = true }

[dev-dependencies]
tempfile = "3"
# MockSplitQueue / build_desc_chain live behind virtio-queue's `test-utils`
# feature; enabled only for our own tests.
virtio-queue = { version = "0.18", features = ["test-utils"] }

[features]
numa = ["dep:hwlocality"]
nvidia = ["dep:nvml-wrapper"]
# Cloud Hypervisor adapter (shells out to the `cloud-hypervisor` / `ch-remote`
# binaries at runtime; not a build-time link, so this feature has no extra deps).
cloud-hypervisor = []
# Application-layer authorization providers for the agent RPC. NoAuth is the
# always-compiled default; the other three are opt-in.
auth-ttl = []
auth-oauth = []
auth-shared-secret = []
rocm = []
# Self-discovering VFIO GPU passthrough adapter. Pure-Rust ioctl wrappers
# via `vfio-ioctls`; the adapter re-discovers at every attach and falls back
# to a host-local reservation if the host has no IOMMU / no vfio-pci bind.
vfio = ["dep:vfio-ioctls"]
# vhost-user device backends (M7): serve virtio devices to Cloud Hypervisor
# over the vhost-user protocol (`nauti vhost serve`, `entropy-serve`, `pump`).
vhost-user = ["dep:vhost", "dep:vhost-user-backend", "dep:virtio-bindings", "dep:virtio-queue", "dep:vmm-sys-util"]
